[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aletheia"
version = "0.1.0"
description = "Aletheia — read what runs, not what is shown. Bytecode-truth scanner for AI agent skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
aletheia = "aletheia.cli:main"

[tool.setuptools.packages.find]
include = ["aletheia*"]
